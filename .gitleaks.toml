title = "Enrichable secret scanning"

[extend]
useDefault = true

[[rules]]
id = "enrichable-mcp-key"
description = "Enrichable full-workspace MCP bearer key"
regex = '''\b(enr_mcp_[A-Za-z0-9_-]{43})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["enr_mcp_"]

[[rules]]
id = "context-dev-api-key"
description = "Context.dev API key"
regex = '''\b(ctxt_[A-Za-z0-9_-]{24,})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["ctxt_"]

[[rules]]
id = "neon-realtime-secret"
description = "Neon Realtime server secret"
regex = '''\b(nrt_live_1[A-Za-z0-9_-]{24,})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["nrt_live_1"]

[[allowlists]]
description = "Placeholder keys in test fixtures"
regexTarget = "secret"
regexes = [
  '''^ctxt_1234567890$''',
  '''^apollo-key-12345$''',
]
